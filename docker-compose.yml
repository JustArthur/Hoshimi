# ============================================================
#  HOSHIMI (星見) — Docker Compose
#  Services : Nginx + PHP-FPM + Radarr + Sonarr + Jellyseerr
# ============================================================

services:

  # --- Serveur Web Nginx ---
  nginx:
    image: nginx:1.25-alpine
    container_name: hoshimi_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - animes_data:/media/animes
      - films_data:/media/films
      - series_data:/media/series
      - hoshimi_data:/var/www/html/data
      - hoshimi_images:/var/www/html/public/images
    networks:
      - hoshimi_net

  # --- Cron — scan quotidien (nouveaux fichiers) ---
  cron-scan:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: hoshimi_cron_scan
    user: "1000:1000"
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - animes_data:/media/animes
      - films_data:/media/films
      - series_data:/media/series
      - hoshimi_data:/var/www/html/data
      - hoshimi_images:/var/www/html/public/images
    environment:
      - ANIMES_PATH=${ANIMES_PATH}
      - FILMS_PATH=${FILMS_PATH}
      - SERIES_PATH=${SERIES_PATH}
      - IMAGES_PATH=${IMAGES_PATH}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - JELLYFIN_URL=${JELLYFIN_URL}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
    command: >
      sh -c "
        run_scan() {
          echo \"[\$\$(date '+%Y-%m-%d %H:%M:%S')] === Scan quotidien ===\";
          python3 /var/www/html/cli/fetch_metadata.py --type anime  --scan \"\${ANIMES_PATH}\" || true;
          python3 /var/www/html/cli/fetch_metadata.py --type film   --scan \"\${FILMS_PATH}\"  || true;
          python3 /var/www/html/cli/fetch_metadata.py --type serie  --scan \"\${SERIES_PATH}\" || true;
          echo \"[\$\$(date '+%Y-%m-%d %H:%M:%S')] === Scan terminé — régénération index ===\";
          php /var/www/html/cli/regen-index.php || true;
          php /var/www/html/cli/jellyfin-map.php || true;
        };
        run_scan;
        while true; do sleep 3600 && run_scan; done
      "
    networks:
      - hoshimi_net

  # --- Watcher — polling 30s sur les dossiers média ---
  watcher:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: hoshimi_watcher
    user: "1000:1000"
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./docker/watcher.sh:/watcher.sh:ro
      - animes_data:/media/animes
      - films_data:/media/films
      - series_data:/media/series
      - hoshimi_data:/var/www/html/data
      - hoshimi_images:/var/www/html/public/images
    environment:
      - ANIMES_PATH=${ANIMES_PATH}
      - FILMS_PATH=${FILMS_PATH}
      - SERIES_PATH=${SERIES_PATH}
      - IMAGES_PATH=${IMAGES_PATH}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - JELLYFIN_URL=${JELLYFIN_URL}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
    command: sh /watcher.sh
    networks:
      - hoshimi_net

  # --- Cron — scan hebdomadaire des épisodes (animes/séries) ---
  cron-episodes:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: hoshimi_cron_episodes
    user: "1000:1000"
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - animes_data:/media/animes
      - series_data:/media/series
      - hoshimi_data:/var/www/html/data
      - hoshimi_images:/var/www/html/public/images
    environment:
      - ANIMES_PATH=${ANIMES_PATH}
      - SERIES_PATH=${SERIES_PATH}
      - TMDB_API_KEY=${TMDB_API_KEY}
    command: >
      sh -c "
        run_episodes() {
          echo \"[\$\$(date '+%Y-%m-%d %H:%M:%S')] === Scan épisodes hebdo ===\";
          python3 /var/www/html/cli/fetch_metadata.py --type anime  --seasons \"\${ANIMES_PATH}\" || true;
          python3 /var/www/html/cli/fetch_metadata.py --type serie  --seasons \"\${SERIES_PATH}\" || true;
          echo \"[\$\$(date '+%Y-%m-%d %H:%M:%S')] === Scan épisodes terminé ===\";
        };
        run_episodes;
        while true; do sleep 604800 && run_episodes; done
      "
    networks:
      - hoshimi_net

  # --- Cron — scan mensuel des scores ---
  cron-scores:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: hoshimi_cron_scores
    user: "1000:1000"
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - animes_data:/media/animes
      - films_data:/media/films
      - series_data:/media/series
      - hoshimi_data:/var/www/html/data
      - hoshimi_images:/var/www/html/public/images
    environment:
      - ANIMES_PATH=${ANIMES_PATH}
      - FILMS_PATH=${FILMS_PATH}
      - SERIES_PATH=${SERIES_PATH}
      - TMDB_API_KEY=${TMDB_API_KEY}
    command: >
      sh -c "
        run_scores() {
          echo \"[\$\$(date '+%Y-%m-%d %H:%M:%S')] === Mise à jour scores mensuelle ===\";
          python3 /var/www/html/cli/fetch_metadata.py --type anime  --update \"\${ANIMES_PATH}\" || true;
          python3 /var/www/html/cli/fetch_metadata.py --type film   --update \"\${FILMS_PATH}\"  || true;
          python3 /var/www/html/cli/fetch_metadata.py --type serie  --update \"\${SERIES_PATH}\" || true;
          echo \"[\$\$(date '+%Y-%m-%d %H:%M:%S')] === Scores terminés ===\";
        };
        run_scores;
        while true; do sleep 2592000 && run_scores; done
      "
    networks:
      - hoshimi_net

  # cron-thumbnails désactivé — génération manuelle via l'admin (/admin/thumbnails)

  # --- PHP-FPM ---
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: hoshimi_php
    user: "1000:1000"
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - animes_data:/media/animes
      - films_data:/media/films
      - series_data:/media/series
      - hoshimi_data:/var/www/html/data
      - hoshimi_images:/var/www/html/public/images
    environment:
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_NAME=${APP_NAME}
      - ANILIST_API_URL=${ANILIST_API_URL}
      - ANIMES_PATH=${ANIMES_PATH}
      - FILMS_PATH=${FILMS_PATH}
      - SERIES_PATH=${SERIES_PATH}
      - IMAGES_PATH=${IMAGES_PATH}
      - ACCESS_TOKEN=${ACCESS_TOKEN}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - LAN_HOST=${LAN_HOST}
      - JELLYFIN_URL=${JELLYFIN_URL}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - JELLYFIN_STREAMING_ENABLED=${JELLYFIN_STREAMING_ENABLED}
    networks:
      - hoshimi_net

  # ============================================================
  #  *ARR STACK — Radarr / Sonarr / Jellyseerr
  # ============================================================

  # --- Radarr (films) ---
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: hoshimi_radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - radarr_config:/config
      - films_data:/media/films
      # Dossier de téléchargement partagé avec qBittorrent (même chemin des deux côtés)
      - downloads_data:/downloads
    ports:
      - "7878:7878"
    networks:
      - hoshimi_net

  # --- Sonarr (séries/animes) ---
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: hoshimi_sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - sonarr_config:/config
      - animes_data:/media/animes
      - series_data:/media/series
      - downloads_data:/downloads
    ports:
      - "8989:8989"
    networks:
      - hoshimi_net

  # --- Prowlarr (gestion centralisée des indexeurs → push vers Radarr/Sonarr) ---
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: hoshimi_prowlarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - prowlarr_config:/config
    ports:
      - "9696:9696"
    networks:
      - hoshimi_net

  # --- Jellyfin (moteur de streaming Hoshimi + backend Jellyseerr) ---
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: hoshimi_jellyfin
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - animes_data:/media/animes:ro
      - films_data:/media/films:ro
      - series_data:/media/series:ro
    ports:
      - "8096:8096"
    networks:
      - hoshimi_net

  # --- Seerr (ex-Jellyseerr — requêtes utilisateurs → Radarr/Sonarr) ---
  jellyseerr:
    image: seerr/seerr:latest
    container_name: hoshimi_jellyseerr
    init: true
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - jellyseerr_config:/app/config
    ports:
      - "5055:5055"
    networks:
      - hoshimi_net
    depends_on:
      - radarr
      - sonarr
      - jellyfin

  # --- qBittorrent + VPN ProtonVPN intégrés (binhex) ---
  # Remplace Gluetun + qBittorrent séparés : le VPN, le kill-switch et le
  # port forwarding NAT-PMP sont gérés en interne par l'image, sans script
  # externe à maintenir.
  qbittorrentvpn:
    image: binhex/arch-qbittorrentvpn:latest
    container_name: hoshimi_qbittorrentvpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      - VPN_ENABLED=yes
      - VPN_PROV=protonvpn
      - VPN_CLIENT=openvpn
      - VPN_USER=${PROTON_OVPN_USER}+pmp
      - VPN_PASS=${PROTON_OVPN_PASS}
      - STRICT_PORT_FORWARD=yes
      - ENABLE_PRIVOXY=no
      - LAN_NETWORK=192.168.0.0/24
      - NAME_SERVERS=1.1.1.1,1.0.0.1
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - WEBUI_PORT=8081
      - TZ=Europe/Paris
      - DEBUG=false
    volumes:
      - qbittorrent_config:/config
      - downloads_data:/downloads
    ports:
      - "8081:8081"
      - "6881:6881"
      - "6881:6881/udp"
    networks:
      - hoshimi_net

# ============================================================
#  VOLUMES
# ============================================================
volumes:

  # Y:\Animes → /media/animes dans le container
  animes_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "Y:\\Animes"

  # Y:\Films → /media/films dans le container
  films_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "Y:\\Films"

  # Y:\Series → /media/series dans le container
  series_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "Y:\\Series"

  # Données persistantes (index JSON) — géré par Docker, hors projet
  hoshimi_data:

  # Images générées (thumbnails, covers) — géré par Docker, hors projet
  hoshimi_images:

  # Config Radarr/Sonarr/Jellyseerr/Jellyfin/qBittorrent — géré par Docker, hors projet
  radarr_config:
  sonarr_config:
  jellyseerr_config:
  qbittorrent_config:
  jellyfin_config:
  jellyfin_cache:
  prowlarr_config:

  # Dossier de téléchargement partagé (torrents en cours + terminés)
  # ⚠️ À adapter : pointe idéalement vers un dossier réel sur Y:\ (voir note ci-dessous)
  downloads_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "Y:\\Downloads_qBitTorrent"

# ============================================================
#  RÉSEAU
# ============================================================
networks:
  hoshimi_net:
    driver: bridge